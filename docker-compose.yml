# Build stage
FROM node:18-alpine as builder

WORKDIR /app

COPY package*.json ./
RUN npm ci

COPY . .

# Build frontend
RUN npm run build

# Runtime stage
FROM node:18-alpine

WORKDIR /app

COPY package*.json ./
RUN npm ci --only=production

# Copy built frontend
COPY --from=builder /app/dist ./dist

# Copy server code
COPY server ./server

EXPOSE 3001

CMD ["npm", "run", "server"]


version: '3.8'

services:
  filestash:
    image: machines/filestash:latest
    container_name: daily-hub-filestash
    restart: unless-stopped
    ports:
      - "8334:8334"
    volumes:
      - ./data/filestash_config:/app/data/state/config
    environment:
      - APPLICATION_URL=http://localhost:8334

  # Optional: Production build of the dashboard
